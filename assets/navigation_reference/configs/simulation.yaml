namespace: red_standard_robot1
seed: 20261105
physics:
  timestep: 0.001
  gravity: 9.80665
  settle_seconds: 2.0
lidar:
  point_rate: 200000
  frame_rate: 10
  min_range: 0.1
  max_range: 70.0
  pattern: assets/mid360.npy
  # Different deterministic phases; not a claim about any particular unit.
  phase: [0, 80000]
  range_sigma: 0.01
  angular_sigma_deg: 0.03
  reflectivity: 0.8
  # Detection endpoints from the Livox 100 klx specification, with an
  # explicitly approximate interpolation between reflectivities.
  noise_enabled: true
imu:
  rate: 200
  accel_limit_g: 4.0
  gyro_limit_dps: 2000.0
  # Engineering initial model, NOT a measured MID360 calibration.
  accel_density_ug: 100.0
  gyro_density_mdps: 4.5
  bandwidth_hz: 40.0
  accel_bias_std: 0.01
  gyro_bias_std: 0.0003
  accel_bias_walk: 0.0003
  gyro_bias_walk: 0.00002
  noise_enabled: true
  # IMU and optical frame co-location is an explicit simulation approximation.
  # Replace with measured extrinsics before claiming hardware equivalence.
  position_in_lidar: [0.0, 0.0, 0.0]
drive:
  max_speed: 4.0
  max_yaw_rate: 4.0
  max_mount_rate: 4.0
  linear_accel: 1.0
  angular_accel: 1.0
  mount_accel: 0.6
  velocity_gain: 8.0
  force_limit: 80.0
  yaw_gain: 4.0
  torque_limit: 6.0
  command_timeout: 0.35

uwb:
  enabled: true
  frame: uwb
  # 2027 communication protocol 0x0203: one XY position payload per second.
  rate_hz: 1.0
  # Simulation installation, not T-DT's -0.245m hardware lever arm.
  antenna_position_body: [-0.16, 0.0, 0.16]
  world_from_uwb:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
  # Desired convention: red supply corner -> blue along X. Identity is a
  # provisional CAD registration; verify origin/axes against the official map.
  position_std_xy: 0.15  # T-DT engineering reference, not a 2027 guarantee.
  bias_std_xy: 0.05  # engineering assumption
  bias_correlation_seconds: 30.0
  profile: normal
  channels:
    normal:
      latency_seconds: 0.13  # official approximate NORMAL referee-link latency
      jitter_std_seconds: 0.02  # engineering assumption
      drop_probability: 0.005  # illustrative value within official <1%
    adverse:
      latency_seconds: 0.20  # official approximate adverse-link latency
      jitter_std_seconds: 0.05  # T-DT timing-jitter reference, not a guarantee
      drop_probability: 0.03
  # Optional stress regions in world XY. No invented official anchor positions
  # or automatic geometric occlusion-to-RF equivalence. Empty = baseline.
  nlos_zones: []
